<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paimon's Shop 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mitr:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  /* Paimon Color Palette */
  --paimon-white: #fdfaf1;      /* สีตัวไพมอน */
  --paimon-gold: #f4d03f;       /* สีเครื่องประดับทอง */
  --paimon-blue: #3d5afe;       /* สีผ้าคลุม/ดวงดาว */
  --paimon-dark: #1a1c2c;       /* สีกรมท่าลึกแบบท้องฟ้า Teyvat */
  --bg-main: #0c0f1d; 
  --bg-card: rgba(255, 255, 255, 0.07);
  --border-color: rgba(244, 208, 63, 0.3);
  --text-muted: #a0a8c3;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Kanit', sans-serif;
  background: var(--bg-main); color: #fff;
  background-image: radial-gradient(circle at 50% 50%, #161b33 0%, #0c0f1d 100%);
  overflow-x: hidden;
  padding-bottom: 110px;
}

/* Background Effects: Twinkling Stars */
.stars-bg {
  position: fixed; inset: 0; z-index: -1;
  background-image: 
    radial-gradient(1px 1px at 20px 30px, #eee, rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 50px 160px, #f4d03f, rgba(0,0,0,0));
  background-repeat: repeat; background-size: 200px 200px;
  opacity: 0.3;
}

/* --- HERO SECTION --- */
.hero {
  background: linear-gradient(180deg, rgba(61, 90, 254, 0.15) 0%, rgba(12, 15, 29, 0) 100%);
  padding: 50px 20px 60px;
  text-align: center;
  position: relative;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 40px;
}
.hero-title {
  font-family: 'Mitr', sans-serif;
  font-size: 34px; font-weight: 700; 
  color: var(--paimon-gold);
  margin-bottom: 4px;
  text-shadow: 0 0 20px rgba(244, 208, 63, 0.5);
}
.hero-sub {
  font-size: 14px; color: var(--paimon-white); opacity: 0.9;
}

/* Tab Control - Paimon Style */
.tab-container {
  position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
  display: flex; background: #1e2235;
  border: 1.5px solid var(--paimon-gold);
  border-radius: 12px; padding: 4px; width: 280px; z-index: 10;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.tab-btn {
  flex: 1; padding: 10px 0; border-radius: 8px; border: none;
  font-family: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: 0.3s; background: transparent; color: var(--text-muted);
}
.tab-btn.active {
  background: var(--paimon-gold); color: #000;
}

/* --- CONTENT & CARDS --- */
.content { max-width: 600px; margin: 0 auto; padding: 0 20px 50px; position: relative; }

.item-card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px; padding: 18px; position: relative;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.item-card.selected {
  border-color: var(--paimon-gold);
  background: rgba(244, 208, 63, 0.05);
  box-shadow: 0 0 20px rgba(244, 208, 63, 0.15);
}

.card-price {
  background: rgba(244, 208, 63, 0.1);
  color: var(--paimon-gold);
  border: 1px solid rgba(244, 208, 63, 0.3);
  font-weight: 700; padding: 4px 12px; border-radius: 6px;
}

.cat-divider span {
  color: var(--paimon-gold);
  text-transform: uppercase; letter-spacing: 1px;
}
.cat-divider::after { background: linear-gradient(90deg, var(--paimon-gold), transparent); }

/* --- BOTTOM BAR --- */
.bottom-bar {
  background: rgba(26, 28, 44, 0.95);
  border-top: 2px solid var(--paimon-gold);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
}
.bb-total span { color: var(--paimon-gold); }
.bb-btn {
  background: linear-gradient(135deg, var(--paimon-gold) 0%, #e67e22 100%);
  color: #000; font-weight: 700;
  box-shadow: 0 4px 15px rgba(244, 208, 63, 0.3);
}

/* --- MODAL --- */
.modal-box {
  background: #1a1c2c; border: 2px solid var(--paimon-gold);
  background-image: radial-gradient(circle at top right, rgba(244, 208, 63, 0.05), transparent);
}
.modal-total-price { color: var(--paimon-gold); }
.modal-btn { background: #2ecc71; color: #fff; }

/* Paimon Icon Floating */
.paimon-float {
  position: absolute; top: -35px; right: 10px; width: 60px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* ปรับสี Particles เป็นสีทองและขาว */
</style>
</head>
<body>
<div class="stars-bg"></div>
<div id="pts"></div>

<div class="hero">
  <div class="hero-title">PAIMON SHOP 🌟</div>
  <div class="hero-sub">"ไม่ได้เป็นอาหารฉุกเฉินนะ! รับอะไรดีคะนักเดินทาง?"</div>
  
  <div class="tab-container">
    <button class="tab-btn" id="btn-info" onclick="switchTab('info')">ข้อมูลร้าน</button>
    <button class="tab-btn active" id="btn-products" onclick="switchTab('products')">เมนูสินค้า</button>
  </div>
</div>

<div class="content">
  <div id="tab-info" class="tab-content">
    <div class="info-card" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px;">
      <h3 style="color: var(--paimon-gold); margin-bottom: 15px;">Showcase & Contact</h3>
      <div class="info-row"><span>Line</span><span>@997pfoig</span></div>
      <div class="info-row"><span>เวลาทำการ</span><span>11:00 - 00:00 น.</span></div>
      <div class="info-row"><span>การรับประกัน</span><span style="color: #2ecc71;">ดูแลไวภายใน 24 ชม.</span></div>
    </div>
  </div>

  <div id="tab-products" class="tab-content active">
    <div class="sh">
      <div class="sh-line" style="background: var(--paimon-gold);"></div>
      <h2>รายการสินค้าทั้งหมด</h2>
    </div>
    <div class="grid-container" id="productGrid"></div>
  </div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div class="bb-info">
    <div class="bb-count" id="cartCount">เลือก 0 รายการ</div>
    <div class="bb-total"><span>฿</span><span id="cartTotal">0</span></div>
  </div>
  <button class="bb-btn" onclick="openSummary()">ยืนยันออเดอร์ ✨</button>
</div>

<script>
  // ปรับสีดวงดาวใน Script ให้เป็นธีมไพมอน
  const P = document.getElementById('pts');
  ['✦','✨','✧','❄️'].forEach(e => {
    for (let j = 0; j < 4; j++) {
      const d = document.createElement('div');
      d.className = 'pt'; d.textContent = e;
      d.style.cssText = `left:${Math.random()*100}vw;font-size:${10+Math.random()*8}px;color:${'#f4d03f,#ffffff,#3d5afe'.split(',')[Math.floor(Math.random()*3)]};animation-duration:${10+Math.random()*15}s;animation-delay:${-Math.random()*25}s;`;
      P.appendChild(d);
    }
  });

  // คัดลอกฟังก์ชัน JavaScript อื่นๆ จากโค้ดเดิมของคุณมาวางต่อตรงนี้ได้เลยครับ
  // (switchTab, products array, renderProducts, toggleItem, updateBottomBar, openSummary, checkout)
</script>
</body>
</html>
