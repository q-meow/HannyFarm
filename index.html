<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wanderer Shop x Nefer 🟢</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #00ff88; /* เขียว Nefer */
  --secondary: #d4af37; /* ทอง */
  --bg-main: #020a08; /* เขียวเข้มเกือบดำ */
  --bg-card: rgba(10, 25, 20, 0.8);
  --border-color: rgba(0, 255, 136, 0.3);
  --text-muted: #70a38d;
}
body {
  font-family: 'Kanit', sans-serif;
  background: var(--bg-main); color: #fff;
  overflow-x: hidden; padding-bottom: 120px;
  background-image: 
    linear-gradient(rgba(0, 255, 136, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 136, 0.05) 1px, transparent 1px);
  background-size: 30px 30px; /* Grid background */
}

/* Glow Background */
.glow-orb {
  position: fixed; top: 20%; left: 50%; transform: translate(-50%, -50%);
  width: 300px; height: 300px; background: radial-gradient(circle, rgba(0, 255, 136, 0.15) 0%, transparent 70%);
  z-index: -1; filter: blur(50px);
}

/* Hero Section */
.hero {
  padding: 50px 20px 60px; text-align: center;
  border-bottom: 2px solid var(--primary);
  background: linear-gradient(to bottom, rgba(0, 255, 136, 0.1), transparent);
  position: relative; clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
}
.hero-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 28px; font-weight: 700; color: var(--primary);
  text-transform: uppercase; letter-spacing: 3px;
  text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
}
.hero-sub { font-size: 13px; color: var(--secondary); margin-top: 5px; font-weight: 300; }

/* Segmented Tabs */
.tab-container {
  position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
  display: flex; background: #0a1a14; border: 1px solid var(--primary);
  border-radius: 4px; padding: 3px; width: 280px; z-index: 10;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
}
.tab-btn {
  flex: 1; padding: 10px 0; border: none; font-family: inherit;
  font-size: 13px; font-weight: 600; cursor: pointer;
  background: transparent; color: var(--text-muted); transition: 0.3s;
}
.tab-btn.active { background: var(--primary); color: #000; box-shadow: 0 0 10px var(--primary); }

/* Content */
.content { max-width: 500px; margin: 50px auto 0; padding: 0 15px; }
.tab-content { display: none; animation: slideIn 0.4s ease-out; }
.tab-content.active { display: block; }
@keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* Product Cards */
.cat-header {
  font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--primary);
  margin: 25px 0 15px; display: flex; align-items: center; gap: 10px;
}
.cat-header::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--primary), transparent); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  padding: 15px; border-radius: 8px; position: relative;
  transition: 0.3s; overflow: hidden;
}
.card::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: conic-gradient(transparent, transparent, var(--primary), transparent);
  animation: rotate 4s linear infinite; opacity: 0;
}
.card.selected { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 255, 136, 0.3); background: rgba(0, 255, 136, 0.05); }
.card.selected::before { opacity: 0.2; }

@keyframes rotate { 100% { transform: rotate(360deg); } }

.card-icon { font-size: 24px; margin-bottom: 8px; filter: drop-shadow(0 0 5px var(--primary)); }
.card-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: #fff; }
.card-price { color: var(--primary); font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; }

/* Info Page */
.info-box {
  background: var(--bg-card); border-left: 4px solid var(--primary);
  padding: 20px; border-radius: 4px; margin-bottom: 15px;
}
.info-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
.info-label { color: var(--primary); }

/* Bottom Bar */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; padding: 20px;
  background: rgba(2, 10, 8, 0.9); backdrop-filter: blur(10px);
  border-top: 1px solid var(--primary); display: flex;
  justify-content: space-between; align-items: center;
  transform: translateY(100%); transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
.bottom-bar.active { transform: translateY(0); }
.total-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
.total-val { font-family: 'Orbitron', sans-serif; font-size: 22px; color: var(--primary); }
.order-btn {
  background: var(--primary); color: #000; border: none; padding: 12px 25px;
  border-radius: 4px; font-weight: 700; font-family: 'Kanit'; cursor: pointer;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
}

/* Modal */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.9);
  display: none; justify-content: center; align-items: center; z-index: 100;
}
.modal.show { display: flex; }
.modal-content {
  background: #0a1a14; border: 1px solid var(--primary);
  width: 90%; max-width: 400px; padding: 25px; border-radius: 8px;
}
</style>
</head>
<body>

<div class="glow-orb"></div>

<div class="hero">
  <div class="hero-title">Wanderer Shop</div>
  <div class="hero-sub">SYSTEM ONLINE • WELCOME USER</div>
  
  <div class="tab-container">
    <button class="tab-btn" onclick="switchTab('info', this)">DATABASE</button>
    <button class="tab-btn active" onclick="switchTab('shop', this)">MARKET</button>
  </div>
</div>

<div class="content">
  <div id="tab-info" class="tab-content">
    <div class="info-box">
      <div class="info-item"><span class="info-label">LINE ID:</span><span>@997pfoig</span></div>
      <div class="info-item"><span class="info-label">STATUS:</span><span style="color:var(--primary)">ONLINE</span></div>
      <div class="info-item"><span class="info-label">WARRANTY:</span><span>24H FAST CLAIM</span></div>
    </div>
    <p style="font-size: 11px; color: var(--text-muted); text-align: center;">* Netflix No Claim Price = No Warranty</p>
  </div>

  <div id="tab-shop" class="tab-content active">
    <div id="product-list"></div>
  </div>
</div>

<div class="bottom-bar" id="cartBar">
  <div>
    <div class="total-label">Selected Total</div>
    <div class="total-val">฿<span id="total-price">0</span></div>
  </div>
  <button class="order-btn" onclick="openModal()">CONFIRM ORDER</button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 style="color:var(--primary); font-family:'Orbitron'; margin-bottom:15px;">SUMMARY</h2>
    <div id="summary-items" style="max-height: 200px; overflow-y: auto; margin-bottom: 20px; font-size:14px;"></div>
    <button class="order-btn" style="width:100%" onclick="sendOrder()">PROCEED TO LINE</button>
    <button onclick="closeModal()" style="background:transparent; color:white; border:none; width:100%; margin-top:10px; cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
const products = [
  { cat: 'NETFLIX 4K', name: 'Mobile 1 Day', price: 15, icon: '📱' },
  { cat: 'NETFLIX 4K', name: 'TV/PC 1 Day', price: 30, icon: '📺' },
  { cat: 'DISNEY+', name: 'Shared 1 Day', price: 35, icon: '🏰' },
  { cat: 'WETV VIP', name: 'Shared 30 Day', price: 30, icon: '🐧' }
];

let cart = [];

function render() {
  const container = document.getElementById('product-list');
  let currentCat = '';
  let html = '';

  products.forEach((p, i) => {
    if (p.cat !== currentCat) {
      html += `<div class="cat-header">${p.cat}</div><div class="grid">`;
      currentCat = p.cat;
    }
    html += `
      <div class="card" id="p-${i}" onclick="toggleSelect(${i})">
        <div class="card-icon">${p.icon}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-price">฿${p.price}</div>
      </div>
    `;
    if (products[i+1]?.cat !== currentCat) html += `</div>`;
  });
  container.innerHTML = html;
}

function toggleSelect(index) {
  const p = products[index];
  const el = document.getElementById(`p-${index}`);
  const cartIdx = cart.findIndex(item => item.name === p.name);

  if (cartIdx > -1) {
    cart.splice(cartIdx, 1);
    el.classList.remove('selected');
  } else {
    cart.push(p);
    el.classList.add('selected');
  }
  updateBar();
}

function updateBar() {
  const bar = document.getElementById('cartBar');
  const total = cart.reduce((s, i) => s + i.price, 0);
  document.getElementById('total-price').innerText = total;
  cart.length > 0 ? bar.classList.add('active') : bar.classList.remove('active');
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  btn.classList.add('active');
}

function openModal() {
  const sum = document.getElementById('summary-items');
  sum.innerHTML = cart.map(i => `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>${i.name}</span><span>฿${i.price}</span></div>`).join('');
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function sendOrder() {
  const text = encodeURIComponent("ต้องการสั่งซื้อสินค้า:\n" + cart.map(i => `- ${i.name} (${i.price}฿)`).join('\n') + `\n\nรวมยอด: ${document.getElementById('total-price').innerText} บาท`);
  window.location.href = "https://lin.ee/Vt7DR6S"; // ใส่ Link Line จริงของคุณ
}

render();
</script>
</body>
</html>
