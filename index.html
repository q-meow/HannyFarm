<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunny Farm</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Fredoka', sans-serif;
}

body{
  background: linear-gradient(180deg,#1f1f3a,#2b2e6e);
  color:white;
  overflow-x:hidden;
  cursor:none;
}

/* Cursor */
.cursor{
  width:30px;
  height:30px;
  border:2px solid #ffd36b;
  border-radius:50%;
  position:fixed;
  pointer-events:none;
  transform:translate(-50%,-50%);
  box-shadow:0 0 15px #ffd36b;
  z-index:9999;
}

/* Stars */
.star{
  position:absolute;
  width:5px;
  height:5px;
  background:white;
  border-radius:50%;
  animation:float 5s infinite ease-in-out;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-20px);}
  100%{transform:translateY(0);}
}

/* Hero */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

.hero h1{
  font-size:60px;
  background: linear-gradient(45deg,#ffb6e6,#8bd3ff,#ffd36b);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  margin-top:10px;
  opacity:0.8;
}

.btn{
  margin-top:20px;
  padding:12px 30px;
  border-radius:20px;
  border:none;
  background: linear-gradient(45deg,#ffb6e6,#8bd3ff);
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px #ffb6e6;
}

/* Sections */
.section{
  padding:80px 20px;
  text-align:center;
}

.card{
  display:inline-block;
  width:220px;
  margin:15px;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 0 20px #8bd3ff;
}

/* Footer */
footer{
  padding:30px;
  text-align:center;
  opacity:0.7;
}
</style>

</head>

<body>

<div class="cursor"></div>

<!-- Hero -->

<section class="hero">
  <h1>🍯 Hunny Farm 🍯</h1>
  <p>บริการฟาร์ม Genshin Impact สุดน่ารัก ปลอดภัย 100%</p>
  <a href="order.html">
    <button class="btn">สั่งฟาร์ม</button>
  </a>
</section>

<!-- Services -->

<section class="section">
  <h2>🌸 บริการของเรา</h2>
  <div class="card">💎 ฟาร์ม Primogem</div>
  <div class="card">⚔️ ปั้นตัวละคร</div>
  <div class="card">🌀 ฟาร์ม Artifact</div>
  <div class="card">🔥 เคลียร์ Abyss</div>
</section>

<!-- Pricing -->

<section class="section">
  <h2>💰 ราคา</h2>
  <div class="card">Basic 100฿</div>
  <div class="card">Pro 300฿</div>
  <div class="card">VIP 500฿</div>
</section>

<!-- Steps -->

<section class="section">
  <h2>📌 ขั้นตอนการใช้บริการ</h2>
  <div class="card">1. เลือกแพ็กเกจ</div>
  <div class="card">2. โอนเงิน</div>
  <div class="card">3. ส่งไอดี</div>
  <div class="card">4. เริ่มฟาร์ม</div>
</section>

<footer>
  💬 ติดต่อ: LINE / Facebook / Discord
</footer>

<script>
// Cursor
const cursor=document.querySelector(".cursor");
document.addEventListener("mousemove",(e)=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

// Stars
for(let i=0;i<40;i++){
  let star=document.createElement("div");
  star.className="star";
  star.style.left=Math.random()*100+"vw";
  star.style.top=Math.random()*100+"vh";
  star.style.animationDuration=(3+Math.random()*5)+"s";
  document.body.appendChild(star);
}
</script>

<!-- Live2D Character -->

<script src="https://unpkg.com/live2d-widget@3.0.4/lib/L2Dwidget.min.js"></script>

<script>
L2Dwidget.init({
  model: {
    jsonPath: "https://unpkg.com/live2d-widget-model-haru@1.0.5/assets/haru01.model.json"
  },
  display: {
    position: "right",
    width: 250,
    height: 350,
    hOffset: 0,
    vOffset: -20
  },
  mobile: {
    show: true
  },
  react: {
    opacityDefault: 1,
    opacityOnHover: 1
  }
});
</script>

</body>
</html>
