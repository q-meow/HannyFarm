<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cazeen - Payment Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ตั้งค่าพื้นฐาน */
        body {
            margin: 0;
            padding: 0;
            background-color: #eaf4fd; /* สีพื้นหลังฟ้าอ่อน */
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        /* กล่องเนื้อหาสีขาวตรงกลาง */
        .card {
            background-color: #ffffff;
            width: 300px;
            border-radius: 35px;
            padding: 40px 20px 30px 20px;
            box-shadow: 0 10px 30px rgba(162, 203, 237, 0.2);
            text-align: center;
            position: relative;
        }

        /* ส่วนหัวชื่อร้าน cazeen */
        .shop-name {
            color: #92c9f0;
            font-size: 38px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(146, 201, 240, 0.15); /* เงาตัวหนังสือ */
        }

        /* ป้ายชื่อบัญชี */
        .account-badge {
            background-color: #bce1fa;
            color: #5c8aa3;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        /* รูปแบบปุ่มทั่วไป */
        .btn-link {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            margin-bottom: 15px;
            border-radius: 25px;
            font-family: 'Kanit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-link:active {
            transform: scale(0.97); /* เวลากดให้ปุ่มยุบลงเล็กน้อย */
        }

        /* ปุ่มหลัก (K plus) พื้นฟ้า */
        .btn-primary {
            background-color: #bce1fa;
            color: #3b6b85;
            border: 2px solid #bce1fa;
        }

        /* ปุ่มรอง (วอเล็ต, โน๊ตสลิป) พื้นขาว ขอบฟ้า */
        .btn-outline {
            background-color: #ffffff;
            color: #3b6b85;
            border: 2px solid #def0fc;
        }

        /* ไอคอนก๊อปปี้ท้ายปุ่ม */
        .copy-icon {
            width: 20px;
            height: 20px;
            background-color: #d1e5f0;
            border: 1px solid #aebac2;
            border-radius: 4px;
            box-shadow: inset -2px -2px 0px rgba(255,255,255,0.5);
        }

        /* ส่วนน้องหมาด้านล่าง */
        .mascot-area {
            margin-top: 25px;
        }

        .mascot-emoji {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .mascot-text {
            color: #8b9eb0;
            font-size: 14px;
            font-weight: 500;
        }

        /* ป๊อปอัปแจ้งเตือน (Toast) */
        .toast {
            position: fixed;
            bottom: 40px;
            background-color: #333333;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 400;
            opacity: 0; /* ซ่อนไว้ก่อน */
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        /* เมื่อต้องการแสดงป๊อปอัป จะใช้คลาสนี้ */
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="shop-name">cazeen</h1>
        
        <div class="account-badge">ชื่อบัญชี สมหญิง เท่านั้น</div>

        <button class="btn-link btn-primary" onclick="copyText('K plus', '0123456789')">
            <span>K plus</span>
            <div class="copy-icon"></div>
        </button>

        <button class="btn-link btn-outline" onclick="copyText('วอเล็ต', '0812345678')">
            <span>วอเล็ต</span>
            <div class="copy-icon"></div>
        </button>

        <button class="btn-link btn-outline" onclick="copyText('โน๊ตสลิป', 'รายละเอียดสลิป')">
            <span>โน๊ตสลิป</span>
            <div class="copy-icon"></div>
        </button>

        <div class="mascot-area">
            <div class="mascot-emoji">🐶</div>
            <div class="mascot-text">โฮ่งๆ รออยู่นะ!</div>
        </div>
    </div>

    <div id="toastMessage" class="toast">คัดลอกสำเร็จแล้ว!</div>

    <script>
        let toastTimeout;

        // ฟังก์ชันสำหรับกดปุ่มแล้วขึ้นแจ้งเตือน (พร้อมจำลองการก๊อปปี้)
        function copyText(buttonName, textToCopy) {
            // 1. สั่งให้ก๊อปปี้ข้อความลง Clipboard
            navigator.clipboard.writeText(textToCopy);

            // 2. จัดการตัวแจ้งเตือน (Toast)
            const toast = document.getElementById("toastMessage");
            toast.innerText = `คัดลอก ${buttonName} สำเร็จแล้ว!`; // เปลี่ยนข้อความตามปุ่มที่กด
            
            // แสดงป๊อปอัป
            toast.classList.add("show");

            // เคลียร์เวลานับถอยหลังเก่า (ถ้ามีการกดรัวๆ)
            clearTimeout(toastTimeout);

            // ซ่อนป๊อปอัปหลังจากผ่านไป 2 วินาที (2000 ms)
            toastTimeout = setTimeout(() => {
                toast.classList.remove("show");
            }, 2000);
        }
    </script>

</body>
</html>
